version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: safar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safar
      POSTGRES_PASSWORD: safar
      POSTGRES_DB: safar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safar_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
